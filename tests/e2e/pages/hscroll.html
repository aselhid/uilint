<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hscroll</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .banner { width: 433px; height: 40px; background: #dde; }
  .card { background: #fff; border: 1px solid #ddd; padding: 16px; width: 300px; margin: 24px 0 0; }
  h3 { margin: 0 0 8px; font: 600 16px/24px Arial, sans-serif; }
  .stat-label, .note { margin: 0 0 8px; font: 14px/20px Arial, sans-serif; }
  .note { margin: 0; }
  .nudge { padding-left: 3px; }
</style></head>
<body>
  <div class="banner"></div>
  <div class="card">
    <div><h3 class="card-title">Monthly revenue</h3></div>
    <div class="nudge"><p class="stat-label">Revenue</p></div>
    <div><p class="note">Updated today</p></div>
  </div>
</body></html>
