<!doctype html>
<html><head><meta charset="utf-8"><title>Modal</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; padding: 24px; }
  dialog { border: 1px solid #ccc; padding: 24px; width: 320px; }
  .modal-title { margin: 0 0 12px 3px; font: 700 18px/24px Arial, sans-serif; }
  dialog p { margin: 0 0 12px; font: 14px/20px Arial, sans-serif; }
</style></head>
<body>
  <button id="open">Open</button>
  <dialog id="d">
    <h2 class="modal-title">Delete project</h2>
    <p>This removes the project for everyone.</p>
    <p>You can't undo this.</p>
  </dialog>
  <script>document.getElementById('open').onclick = () => document.getElementById('d').showModal();</script>
</body></html>
