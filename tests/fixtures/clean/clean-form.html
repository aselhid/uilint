<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/20px Arial, sans-serif; color: #1f2328; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
  h1 { margin: 0 0 4px; font: 700 24px/32px Arial, sans-serif; }
  .lead { margin: 0 0 32px; color: #59636e; }
  .field { margin-bottom: 24px; }
  label { display: block; margin-bottom: 8px; font-weight: 700; }
  input, select { display: block; width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d0d7de; border-radius: 6px; font: 14px Arial, sans-serif; }
  .help { margin: 8px 0 0; color: #59636e; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  .check input { width: 16px; height: 16px; margin: 0; }
  .check label { margin: 0; font-weight: 400; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; padding-top: 24px; border-top: 1px solid #e5e7eb; }
  .btn { height: 36px; padding: 0 16px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; font: 14px Arial, sans-serif; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
</style></head>
<body>
  <main>
    <h1>Profile</h1>
    <p class="lead">This is how other people see you on the site.</p>
    <div class="field"><label for="name">Name</label><input id="name" value="Jane Cooper"><p class="help">Use the name people know you by.</p></div>
    <div class="field"><label for="email">Email</label><input id="email" value="jane@example.com"></div>
    <div class="field"><label for="tz">Time zone</label><select id="tz"><option>Europe/Amsterdam</option></select></div>
    <div class="check"><input type="checkbox" id="news"><label for="news">Send me product updates</label></div>
    <div class="buttons"><button class="btn">Cancel</button><button class="btn primary">Save changes</button></div>
  </main>
</body></html>
