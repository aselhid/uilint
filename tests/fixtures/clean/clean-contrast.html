<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Launch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/24px Arial, sans-serif; color: #333; }
  .hero { position: relative; padding: 48px 24px; }
  .hero-bg { position: absolute; inset: 0; background: #14213d; }
  .hero h1 { position: relative; margin: 0; font: 700 32px/40px Arial, sans-serif; color: #fff; }
  .photo { padding: 48px 24px; background: #333 url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==") center / cover; }
  .photo h2 { margin: 0; font: 700 24px/32px Arial, sans-serif; color: #fff; }
  main { padding: 32px 24px; }
  main p { margin: 0 0 24px; }
  .btn { height: 40px; padding: 0 20px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font: 700 14px Arial, sans-serif; }
  input { display: block; width: 240px; height: 36px; margin-bottom: 24px; padding: 0 12px; border: 1px solid #8c959f; border-radius: 6px; font: 14px Arial, sans-serif; }
  input::placeholder { color: #6e7781; }
</style></head>
<body>
  <section class="hero"><div class="hero-bg"></div><h1>Ship it this week</h1></section>
  <section class="photo"><h2>Built by the team</h2></section>
  <main>
    <p>Everything you need to launch, with nothing to set up.</p>
    <input placeholder="Work email">
    <button class="btn">Get started</button>
  </main>
</body></html>
